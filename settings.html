<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - ElderSmart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body class="dashboard-page">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="dashboard-container">
            <header class="dashboard-header stagger-1">
                <div>
                    <h1>Account Settings</h1>
                    <p class="subtitle text-muted">Manage your profile and security preferences.</p>
                </div>
            </header>

            <!-- Profile Card -->
            <div class="card stagger-2" style="max-width: 640px; margin-bottom: 30px;">
                <div class="settings-profile-header">
                    <div class="settings-avatar" id="settingsAvatar">U</div>
                    <div>
                        <h2 class="font-bold text-lg">Public Profile</h2>
                        <p class="text-muted text-sm">This will be visible to other caregivers.</p>
                    </div>
                </div>

                <form id="profileForm" class="settings-form">
                    <div class="form-group">
                        <label class="form-label">Display Name</label>
                        <input type="text" id="displayName" class="input-field" placeholder="e.g. Sarah Smith" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="displayEmail" class="input-field input-disabled" disabled>
                        <p class="form-hint">Email cannot be changed.</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <input type="text" id="displayRole" class="input-field input-disabled" disabled>
                    </div>

                    <button type="submit" class="btn-primary w-full mt-2">
                        <i class="fas fa-save" style="margin-right: 8px;"></i> Save Profile Changes
                    </button>
                </form>
            </div>

            <!-- Security Card -->
            <div class="card stagger-3" style="max-width: 640px; border-left: 4px solid var(--danger);">
                <div class="flex items-center gap-3 mb-6">
                    <div class="icon-box-sm bg-danger-light"><i class="fas fa-shield-alt"></i></div>
                    <h2 class="font-bold text-lg">Security</h2>
                </div>

                <form id="passwordForm" class="settings-form">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="newPassword" class="input-field" placeholder="Minimum 6 characters" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password" required>
                    </div>

                    <button type="submit" class="btn-danger w-full mt-2">
                        <i class="fas fa-key" style="margin-right: 8px;"></i> Update Password
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script src="js/firebase.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
