<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medications - ElderSmart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body class="dashboard-page">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="dashboard-container">

            <header class="dashboard-header">
                <div>
                    <h2 class="text-xs text-muted uppercase font-bold tracking-widest mb-1">Health & Care</h2>
                    <h1 class="text-3xl font-bold text-dark">Medication Tracker</h1>
                </div>
                <button class="btn-primary hidden" onclick="openMedModal()" id="addMedBtn">
                    <i class="fas fa-plus"></i> Add Medication
                </button>
            </header>

            <!-- Stats Row -->
            <div class="stats-row mb-6" id="medStatsRow">
                <div class="stat-card bg-white border-subtle">
                    <div class="icon-square bg-info-light"><i class="fas fa-pills text-info"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statTotalMeds">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Total Meds</p>
                    </div>
                </div>
                <div class="stat-card bg-white border-subtle">
                    <div class="icon-square bg-success-light"><i class="fas fa-calendar-check text-success"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statDueToday">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Due Today</p>
                    </div>
                </div>
                <div class="stat-card bg-white border-subtle" id="statLowStockCard">
                    <div class="icon-square bg-warning-light"><i class="fas fa-exclamation-triangle text-warning"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statLowStock">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Low Stock</p>
                    </div>
                </div>
            </div>

            <!-- Today's Schedule -->
            <div class="side-card mb-6" style="border-radius:20px;">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="font-bold text-dark" id="scheduleTitle">Today's Schedule</h3>
                        <p class="text-xs text-muted">Track daily medication adherence</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-calendar-alt text-muted" style="font-size:14px;"></i>
                        <input type="text" id="historyDate" style="width:130px; margin:0; font-size:13px; padding:8px 12px; border-radius:10px;">
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="checklistTable" style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f5f9;">
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Status</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Time</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Elder</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Medication</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Dosage</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="checklistBody">
                            <tr><td colspan="6" style="text-align:center; color:#9ca3af; padding:24px; font-size:14px;">Loading schedule...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Medicine Cabinet -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="font-bold text-dark text-lg">Medicine Cabinet</h3>
                    <p class="text-xs text-muted">All active prescriptions</p>
                </div>
                <span id="medsCabinetCount" class="text-xs font-bold text-muted"></span>
            </div>
            <div class="cards" id="medsList">
                <p class="text-muted">Loading inventory...</p>
            </div>

        </div>
    </main>

    <div id="medModal" class="modal">
        <div class="modal-card" style="width: 600px; max-width: 95%;">
            <h2 id="medModalTitle" class="confirm-title mb-4" style="text-align:left;">Add New Medication</h2>
            <form id="medForm">
                <input type="hidden" id="medId">

                <label class="mb-2">For Elder</label>
                <select id="medElder" class="mb-3" required></select>

                <label class="mb-2">Medication Name</label>
                <input type="text" id="medName" class="mb-3" placeholder="e.g. Lisinopril" required>

                <div class="flex gap-4 mb-3">
                    <div class="w-full">
                        <label>Medicine Form</label>
                        <select id="medFormType" onchange="updateMedUnits(this.value)">
                            <option value="pill">Pill (Tablet/Capsule)</option>
                            <option value="liquid">Liquid (ml)</option>
                            <option value="inhaler">Inhaler (Puffs)</option>
                            <option value="injection">Injection (Units/ml)</option>
                            <option value="topical">Topical (Apply)</option>
                            <option value="drops">Drops (Eye/Ear)</option>
                        </select>
                    </div>
                    <div class="w-full">
                        <label>Dose Amount (<span id="doseUnitLabel">pills</span>)</label>
                        <div style="display: flex; align-items: stretch; gap: 8px;">
                            <input type="number" id="medPerDose" placeholder="1" value="1" step="0.01" required style="flex: 1; margin-bottom: 0; min-height: 44px;">
                            <div style="display: flex; gap: 4px;">
                                <button type="button" onclick="setDose(0.25)" class="btn-secondary" style="padding: 0 12px; font-size: 14px; font-weight: 700; height: auto; border-radius: 12px;">¼</button>
                                <button type="button" onclick="setDose(0.5)" class="btn-secondary" style="padding: 0 12px; font-size: 14px; font-weight: 700; height: auto; border-radius: 12px;">½</button>
                                <button type="button" onclick="setDose(0.75)" class="btn-secondary" style="padding: 0 12px; font-size: 14px; font-weight: 700; height: auto; border-radius: 12px;">¾</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 mb-3">
                    <div class="w-full">
                        <label>Dosage Strength</label>
                        <input type="text" id="medDosage" placeholder="e.g. 10mg or 500mg/5ml" required>
                    </div>
                    <div class="w-full">
                        <label>Time</label>
                        <input type="text" id="medTime" placeholder="Select Time..." required style="background: white;">
                    </div>
                </div>

                <div class="flex gap-4 mb-3">
                    <div class="w-full">
                        <label>Current Stock (<span id="stockUnitLabel">pills</span>)</label>
                        <input type="number" id="medStock" placeholder="e.g. 30" step="0.1">
                    </div>
                    <div class="w-full">
                        <label>Meal Instruction</label>
                        <select id="medInstruction">
                            <option value="none">No specific instructions</option>
                            <option value="before">Before Food</option>
                            <option value="after">After Food</option>
                            <option value="with">With Food</option>
                            <option value="empty">Empty Stomach</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-2 mt-4">
                    <label style="margin-bottom:0; font-weight:700;">Frequency</label>
                    <div class="flex items-center gap-2 px-3 py-1 bg-primary-light border border-primary-subtle rounded-full cursor-pointer" style="transition:all 0.2s;">
                        <input type="checkbox" id="isPRN" onchange="toggleFrequency(this.checked)" style="width:14px; height:14px;"> 
                        <span class="text-xs font-bold text-primary uppercase tracking-tight">As Needed (PRN)</span>
                    </div>
                </div>
                <select id="medFrequency" onchange="toggleDaysSelector(this.value)">
                    <option value="daily">Every Day</option>
                    <option value="specific">Specific Days</option>
                </select>

                <div id="daysSelector" class="hidden mb-4 p-4 bg-gray-50 border rounded-2xl">
                    <label class="mb-3 block font-bold text-dark" style="font-size:13px;">Select Scheduled Days:</label>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="0"> Sun</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="1"> Mon</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="2"> Tue</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="3"> Wed</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="4"> Thu</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="5"> Fri</label>
                        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="weekDay" value="6"> Sat</label>
                    </div>
                </div>

                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <label>Notes</label>
                        <input type="text" id="medNotes" placeholder="Take with food...">
                    </div>
                    <div class="w-full">
                        <label>Reminder Option</label>
                        <select id="medReminder">
                            <option value="0">At time of dose</option>
                            <option value="15">15 mins before</option>
                            <option value="30">30 mins before</option>
                            <option value="60">1 hour before</option>
                            <option value="none">No reminder</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="closeMedModal()" class="btn-secondary w-full">Cancel</button>
                    <button type="submit" id="saveMedBtn" class="btn-primary w-full">Save Medication</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/services.js"></script>
    <script src="js/medications.js"></script>
</body>
</html>
