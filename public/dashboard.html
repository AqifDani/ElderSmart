<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>

<script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!currentUser) {
        window.location.replace("login.html");
    } else if (currentUser.role === "Elder") {
        window.location.replace("elder-dashboard.html");
    } else if (currentUser.role === "Family Caregiver") {
        window.location.replace("caregiver-dashboard.html");
    } else {
        window.location.replace("login.html");
    }
</script>

</body>
</html>
