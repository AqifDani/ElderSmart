<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medications - ElderSmart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body class="dashboard-page">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="dashboard-container">

            <header class="dashboard-header">
                <div>
                    <h2 class="text-xs text-muted uppercase font-bold tracking-widest mb-1">Health & Care</h2>
                    <h1 class="text-3xl font-bold text-dark">Medication Tracker</h1>
                </div>
                <button class="btn-primary hidden" onclick="openMedModal()" id="addMedBtn">
                    <i class="fas fa-plus"></i> Add Medication
                </button>
            </header>

            <!-- Stats Row -->
            <div class="stats-row mb-6" id="medStatsRow">
                <div class="stat-card bg-white border-subtle">
                    <div class="icon-square bg-info-light"><i class="fas fa-pills text-info"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statTotalMeds">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Total Meds</p>
                    </div>
                </div>
                <div class="stat-card bg-white border-subtle">
                    <div class="icon-square bg-success-light"><i class="fas fa-calendar-check text-success"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statDueToday">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Due Today</p>
                    </div>
                </div>
                <div class="stat-card bg-white border-subtle" id="statLowStockCard">
                    <div class="icon-square bg-warning-light"><i class="fas fa-exclamation-triangle text-warning"></i></div>
                    <div class="mt-2">
                        <h2 class="text-2xl font-bold text-dark" id="statLowStock">--</h2>
                        <p class="text-xs text-muted font-bold uppercase">Low Stock</p>
                    </div>
                </div>
            </div>

            <!-- Today's Schedule -->
            <div class="side-card mb-6" style="border-radius:20px;">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="font-bold text-dark" id="scheduleTitle">Today's Schedule</h3>
                        <p class="text-xs text-muted">Track daily medication adherence</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-calendar-alt text-muted" style="font-size:14px;"></i>
                        <input type="text" id="historyDate" style="width:130px; margin:0; font-size:13px; padding:8px 12px; border-radius:10px;">
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="checklistTable" style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f5f9;">
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Status</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Time</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Elder</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Medication</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Dosage</th>
                                <th style="text-align:left; padding:10px 12px; font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:800; letter-spacing:0.5px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="checklistBody">
                            <tr><td colspan="6" style="text-align:center; color:#9ca3af; padding:24px; font-size:14px;">Loading schedule...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Medicine Cabinet -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="font-bold text-dark text-lg">Medicine Cabinet</h3>
                    <p class="text-xs text-muted">All active prescriptions</p>
                </div>
                <span id="medsCabinetCount" class="text-xs font-bold text-muted"></span>
            </div>
            <div class="cards" id="medsList">
                <p class="text-muted">Loading inventory...</p>
            </div>

        </div>
    </main>

    <div id="medModal" class="modal">
        <div class="modal-card">
            <h2 id="medModalTitle">Add New Medication</h2>
            <form id="medForm">
                <input type="hidden" id="medId">

                <label>For Elder</label>
                <select id="medElder" required></select>

                <label>Medication Name</label>
                <input type="text" id="medName" placeholder="e.g. Lisinopril" required>

                <div class="flex gap-4">
                    <div class="w-full">
                        <label>Dosage</label>
                        <input type="text" id="medDosage" placeholder="e.g. 10mg" required>
                    </div>
                    <div class="w-full">
                        <label>Time</label>
                        <input type="text" id="medTime" placeholder="Select Time..." required style="background: white;">
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="w-full">
                        <label>Current Stock</label>
                        <input type="number" id="medStock" placeholder="e.g. 30">
                    </div>
                    <div class="w-full">
                        <label>Pills per Dose</label>
                        <input type="number" id="medPerDose" placeholder="1" value="1">
                    </div>
                </div>

                <label>Frequency</label>
                <select id="medFrequency" onchange="toggleDaysSelector(this.value)">
                    <option value="daily">Every Day</option>
                    <option value="specific">Specific Days</option>
                </select>

                <div id="daysSelector" class="hidden mb-4 p-4 bg-gray-50 border rounded-lg">
                    <label class="mb-2">Select Days:</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="0"> Sun</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="1"> Mon</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="2"> Tue</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="3"> Wed</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="4"> Thu</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="5"> Fri</label>
                        <label class="text-sm"><input type="checkbox" name="weekDay" value="6"> Sat</label>
                    </div>
                </div>

                <label>Notes</label>
                <input type="text" id="medNotes" placeholder="Take with food...">

                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="closeMedModal()" class="btn-secondary w-full">Cancel</button>
                    <button type="submit" id="saveMedBtn" class="btn-primary w-full">Save Medication</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/firebase.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/services.js"></script>
    <script src="js/medications.js"></script>
</body>
</html>
