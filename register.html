<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderSmart – Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body class="auth-split-page">

    <div class="auth-visual">
        <img src="https://i.pinimg.com/1200x/34/e3/77/34e3773f3da380747dcc0eea5b5cab22.jpg" alt="Happy Family">
        <div class="visual-overlay">
            <h2>Confidence and reassurance for the whole family</h2>
            <p>Seamless care coordination, health tracking, and stay connected.</p>
        </div>
    </div>

    <div class="auth-form-container">
        <div class="auth-card-modern">
            <div class="logo-header">
                <i class="fas fa-heartbeat text-primary" style="font-size: 32px;"></i>
                <span style="font-size: 24px; font-weight: 700; color: var(--primary-dark);">ElderSmart</span>
            </div>

            <h1 class="auth-title">Create Account</h1>
            <p class="text-muted mb-4">Start your care journey today.</p>

            <form onsubmit="registerUser(event)" class="text-left">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="e.g. John Doe" required>

                <label>Email</label>
                <input type="email" id="regEmail" placeholder="john@example.com" required>

                <label>Password</label>
                <input type="password" id="regPassword" placeholder="******" required>

                <label>Confirm Password</label>
                <input type="password" id="regConfirmPassword" placeholder="******" required>

                <div class="grid-2-cols" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>I am a...</label>
                        <select id="regRole" required>
                            <option value="caregiver">Caregiver</option>
                            <option value="elder">Elder</option>
                        </select>
                    </div>
                    <div>
                         <label>Family Code</label>
                         <input type="text" id="regFamilyCode" placeholder="(Optional)">
                    </div>
                </div>

                <button type="submit" id="regBtn" class="btn-primary mt-2" style="width: 100%;">
                    Register Now
                </button>
            </form>

            <p class="mt-4 text-sm text-center text-muted">
                Already have an account? <a href="login.html" class="text-link">Login</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
